name: self-check
on:
  pull_request:
  push:
    branches: [main]
  # Daily: catches drift no push can catch — an action retagged upstream after
  # we pinned it, and a marketplace manifest edited in its own repo. GitHub
  # disables schedules after 60 days of repo inactivity; re-enable from the
  # Actions tab if this repo ever goes that quiet.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Tools import and run
        run: |
          for f in plugins/sdl/lib/*.py; do
            python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done
          for t in validate check_pins new_cycle gen_index dep_facts open_risks cycle_stamp; do
            python "plugins/sdl/lib/$t.py" --help > /dev/null
          done
      - name: Unit tests
        # Discovery rather than a hand-listed set: a new lib/test_*.py that CI
        # silently never runs is worse than no test at all.
        run: python -m unittest discover -v -s lib -p 'test_*.py'
        working-directory: plugins/sdl
      - name: INDEX.md is current
        run: python plugins/sdl/lib/gen_index.py --check

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Unit tests
        run: python -m unittest discover -v -s scripts -p 'test_*.py'
      # On a PR: shipped content may not change without a version bump and a
      # changelog entry.
      - name: Version bump accompanies shipped changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          python scripts/check_release.py --mode pr --base "origin/$BASE_REF"
      # Released-mode deliberately does NOT run on push to main. Between a
      # merge and the release that follows it, every released-mode failure is
      # transient by design (no tag yet, manifest not yet bumped) — and since
      # release.sh refuses to release a commit whose checks are red, failing
      # here would deadlock releases outright. On the daily run, a release
      # still pending is a real signal.
      - name: Released state is consistent
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_release.py --mode released

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Action pins match upstream tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 plugins/sdl/lib/check_pins.py --exempt savioke/sdl

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh plugins/sdl/lib/*.sh

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required files exist
        run: |
          set -e
          for f in \
            plugins/sdl/.claude-plugin/plugin.json \
            plugins/sdl/.codex-plugin/plugin.json \
            plugins/sdl/skills/sdl-spec/SKILL.md \
            plugins/sdl/skills/sdl-threat-model/SKILL.md \
            plugins/sdl/skills/sdl-review/SKILL.md \
            plugins/sdl/skills/sdl-review/security-checks.md \
            plugins/sdl/skills/sdl-baseline/SKILL.md \
            plugins/sdl/skills/sdl-dep-update/SKILL.md \
            plugins/sdl/templates/baseline.md \
            plugins/sdl/templates/docs-sdl/.sdl-meta.yml \
            plugins/sdl/templates/docs-sdl/01-requirements.md \
            plugins/sdl/templates/docs-sdl/02-threat-model.md \
            plugins/sdl/templates/docs-sdl/03-implementation.md \
            plugins/sdl/templates/docs-sdl/04-verification.md \
            plugins/sdl/templates/docs-sdl/dep-update.md \
            .github/workflows/sdl-validate.yml \
            CHANGELOG.md \
            docs/releasing.md \
            scripts/install.sh \
            scripts/release.sh \
            scripts/check_release.py \
            scripts/sync-to-repo.sh \
            plugins/sdl/lib/sync_to_repo.sh \
            plugins/sdl/lib/validate.py \
            plugins/sdl/lib/check_pins.py \
            plugins/sdl/lib/new_cycle.py \
            plugins/sdl/lib/gen_index.py \
            plugins/sdl/lib/dep_facts.py \
            plugins/sdl/lib/open_risks.py \
            plugins/sdl/lib/cycle_stamp.py \
            docs/dependency-updates.md \
            docs/62443-mapping.md \
            docs/developer-guide.md \
            docs/admin-setup.md
          do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"
      - name: JSON parses
        run: |
          python -c "import json; json.load(open('plugins/sdl/.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('plugins/sdl/.codex-plugin/plugin.json'))"
