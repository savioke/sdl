name: self-check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - name: Validator imports and runs
        run: |
          python -c "import ast; ast.parse(open('lib/validate.py').read())"
          python lib/validate.py --help
      - name: Unit tests
        run: python -m unittest -v lib.test_validate lib.test_check_pins lib.test_new_cycle lib.test_gen_index
      - name: INDEX.md is current
        run: python lib/gen_index.py --check

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Action pins match upstream tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 lib/check_pins.py --exempt savioke/sdl

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Required files exist
        run: |
          set -e
          for f in \
            .claude-plugin/marketplace.json \
            plugins/sdl/.claude-plugin/plugin.json \
            skills/sdl-spec/SKILL.md \
            skills/sdl-threat-model/SKILL.md \
            skills/sdl-review/SKILL.md \
            skills/sdl-review/security-checks.md \
            skills/sdl-baseline/SKILL.md \
            skills/sdl-dep-update/SKILL.md \
            templates/baseline.md \
            templates/docs-sdl/.sdl-meta.yml \
            templates/docs-sdl/01-requirements.md \
            templates/docs-sdl/02-threat-model.md \
            templates/docs-sdl/03-implementation.md \
            templates/docs-sdl/04-verification.md \
            templates/docs-sdl/dep-update.md \
            .github/workflows/sdl-validate.yml \
            scripts/install.sh \
            scripts/sync-to-repo.sh \
            lib/validate.py \
            lib/check_pins.py \
            lib/new_cycle.py \
            lib/gen_index.py \
            docs/dependency-updates.md \
            docs/62443-mapping.md \
            docs/developer-guide.md \
            docs/admin-setup.md
          do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"
      - name: JSON parses
        run: |
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python -c "import json; json.load(open('plugins/sdl/.claude-plugin/plugin.json'))"
