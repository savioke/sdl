name: sdl
on:
  pull_request:
  # The pull_request run is the gate. The push run exists to catch code that
  # reached main without one — a direct push — and skips anything that arrived
  # through a merged PR. Branch-filtered deliberately: an unfiltered push also
  # fires on tag pushes, where there is nothing to validate.
  push:
    branches: [main]
jobs:
  validate:
    # This repo is a consumer of its own gate, and pins the same moving major
    # alias every other consumer pins. Move it with each major, once the tag
    # exists — a PR cannot point at an alias its own release has yet to cut.
    uses: savioke/sdl/.github/workflows/sdl-validate.yml@v2
