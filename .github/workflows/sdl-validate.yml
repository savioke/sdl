name: sdl-validate
on:
  workflow_call:
    inputs:
      base:
        description: Merge base ref to compare against
        required: false
        type: string
        default: origin/main
      sdl_ref:
        description: Ref of savioke/sdl to use for validator code
        required: false
        type: string
        default: v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Checkout sdl-governance
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: savioke/sdl
          ref: ${{ inputs.sdl_ref }}
          path: .sdl-governance

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Run validator
        run: |
          python .sdl-governance/plugins/sdl/lib/validate.py \
            --base "${{ inputs.base }}" \
            --repo .
