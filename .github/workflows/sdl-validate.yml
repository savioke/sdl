name: sdl-validate
on:
  workflow_call:
    inputs:
      base:
        description: Merge base ref to compare against
        required: false
        type: string
        default: origin/main
      sdl_ref:
        description: Ref of savioke/sdl to use for validator code
        required: false
        type: string
        default: v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout sdl-governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: savioke/sdl
          ref: ${{ inputs.sdl_ref }}
          path: .sdl-governance

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run validator
        run: |
          python .sdl-governance/plugins/sdl/lib/validate.py \
            --base "${{ inputs.base }}" \
            --repo .
